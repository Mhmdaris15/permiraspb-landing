server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── compression ──
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/wasm font/woff2;

    # ── health probe (used by the container HEALTHCHECK) ──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── hashed build assets → cache hard (filenames change on rebuild) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA: every unknown path falls back to the app shell ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── never cache the entry document ──
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── baseline security headers ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
